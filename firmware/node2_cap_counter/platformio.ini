; PlatformIO Project Configuration for Node 2 Cap Counter (ESP32)
;
; Build:   pio run -e esp32dev
; Upload:  pio run -e esp32dev -t upload
; Monitor: pio device monitor
;
; BEFORE BUILDING: copy secrets.h.example -> secrets.h and fill it in.
; `secrets.h` is gitignored and must NOT be committed.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    ; NOTE: do NOT set ARDUINO_USB_CDC_ON_BOOT on a classic ESP32 — there is
    ; no native USB peripheral, and it redefines Serial to HWCDCSerial, which
    ; does not exist on this target.
    ; `secrets.h` lives in the project root (gitignored); add it to the
    ; include path so `#include "secrets.h"` resolves.
    -I.

; Required libraries (ESP-NOW, WiFi built-in)
lib_deps =

; For ESP32-S3 instead of ESP32:
; [env:esp32s3dev]
; platform = espressif32
; board = esp32s3dev
; framework = arduino