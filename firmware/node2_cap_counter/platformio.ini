; PlatformIO Project Configuration for Node 2 Cap Counter (ESP32)
; Build: pio run -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Required libraries (ESP-NOW, WiFi built-in)
lib_deps =

; For ESP32-S3 instead of ESP32:
; [env:esp32s3dev]
; platform = espressif32
; board = esp32s3dev
; framework = arduino