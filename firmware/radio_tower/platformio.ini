; PlatformIO Project Configuration for Radio Tower (ESP32-S3)
; Build: pio run -t upload
; Monitor: pio device monitor

[env:esp32s3dev]
platform = espressif32
board = esp32s3dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; PSRAM required for camera + displays + SD + Supabase
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Required libraries
lib_deps =
    ; Built-in: WiFi, ESP-NOW, esp_camera, SD_MMC, SPI, Wire
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.9.4
    adafruit/Adafruit SSD1306@^2.5.7
    bblanchon/ArduinoJson@^7.0.4
    ; ESPSupabase - install from GitHub or local
    ; https://github.com/your-org/ESPSupabase
    ; For now, you'll need to add this manually or use the library manager
    
; Custom partition (huge_app.csv) for camera + displays
; 3MB app / 1MB SPIFFS