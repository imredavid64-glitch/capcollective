; PlatformIO Project Configuration — Radio Tower (ESP32-S3)
;
; Build:   pio run -e esp32-s3-devkitm-1
; Upload:  pio run -e esp32-s3-devkitm-1 -t upload
; Monitor: pio device monitor
;
; BEFORE BUILDING: copy secrets.h.example -> secrets.h and fill it in.
; `secrets.h` is gitignored and must NOT be committed.

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; PSRAM required for camera + displays + SD
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; `secrets.h` lives in the project root (gitignored); add it to the
    ; include path so `#include "secrets.h"` resolves.
    -I.

; Required libraries
; WiFi, ESP-NOW, esp_camera, SD_MMC, SPI, Wire, HTTPClient are built in.
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.9.4
    adafruit/Adafruit SSD1306@^2.5.7
    bblanchon/ArduinoJson@^7.0.4

; Supabase upload uses PostgREST over HTTPClient — no third-party
; library required.

; Custom partition (huge_app.csv): 3MB app / 1MB SPIFFS
