; PlatformIO Project Configuration — Node 1 Cap Counter (ESP32-S3 CAM)
;
; Build:   pio run -e esp32s3cam
; Upload:  pio run -e esp32s3cam -t upload
; Monitor: pio device monitor
;
; BEFORE BUILDING: copy secrets.h.example -> secrets.h and fill it in.
; `secrets.h` is gitignored and must NOT be committed.

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Camera requires PSRAM and a large app partition
board_build.partitions = huge_app.csv
board_build.arduino.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    ; The Freenove board manifest already sets USB_MODE=0 / CDC_ON_BOOT=0
    ; (it uses a CH343 UART bridge, not native USB). Do not override.
    ; `secrets.h` lives in the project root (gitignored); add it to the
    ; include path so `#include "secrets.h"` resolves.
    -I.

; ESP-NOW, WiFi, esp_camera are built in.
; TensorFlow Lite is optional (only for USE_TFLITE=1):
;   https://github.com/espressif/tflite-micro-esp
lib_deps =

; Custom partition (huge_app.csv): 3MB app / 1MB SPIFFS
