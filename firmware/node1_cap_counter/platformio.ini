; PlatformIO Project Configuration for Node 1 Cap Counter (ESP32-S3 CAM)
; Build: pio run -t upload
; Monitor: pio device monitor

[env:esp32s3cam]
platform = espressif32
board = esp32s3cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Camera requires PSRAM and large app partition
board_build.partitions = huge_app.csv
board_build.arduino.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Required libraries
lib_deps =
    ; ESP-NOW, WiFi, esp_camera are built-in
    ; TensorFlow Lite (optional, for USE_TFLITE=1)
    ; https://github.com/espressif/tflite-micro-esp
    
; Custom partition for camera (huge_app.csv)
; 3MB app / 1MB SPIFFS / rest for data
; Create huge_app.csv in this folder if needed:
; # Name,   Type, SubType, Offset,  Size, Flags
; nvs,      data, nvs,     0x9000,  0x6000,
; otadata,  data, ota,     0xf000,  0x2000,
; app0,     app,  ota_0,   0x10000, 0x300000,
; app1,     app,  ota_1,   0x310000,0x300000,
; spiffs,   data, spiffs,  0x610000,0x100000,
; coredump, data, coredump,0x710000,0x10000,

; For camera projects, you may need to adjust partitions
; See: https://docs.espressif.com/projects/arduino-esp32/en/latest/partition_tables.html