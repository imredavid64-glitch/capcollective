  - Getting Started:
      - Quick Start: getting-started/quick-start.md
      - Implementation Readiness: getting-started/readiness-audit.md
      - Admin Checklist: getting-started/admin-checklist.md
      - Budget Tiers: getting-started/budget-tiers.md
  - The Program:
      - Overview: program/overview.md
      - 5-Step Process: program/process.md
      - Grade Bands: program/grade-bands.md
      - Safety First: program/safety.md
  - Implementation:
      - Teacher Guide: implementation/teacher-guide.md
      - Launch Week: implementation/launch-week.md
      - Operations Playbook: implementation/operations.md
      - Command Center: implementation/command-center.md
      - Student Roles: implementation/student-roles.md
  - Curriculum:
      - Standards Mapping: curriculum/standards.md
      - Lesson Plans: curriculum/lesson-plans.md
      - Student Worksheets: curriculum/worksheets.md
      - Certification: curriculum/certification.md
  - Products & Business:
      - Product Development: business/product-development.md
      - Eco-Store Operations: business/eco-store.md
      - Digital Products: business/digital-products.md
      - Grant Templates: business/grants.md
  - Technical:
      - IoT & Sensors: technical/iot.md
      - Firmware: technical/firmware.md
      - Dashboard Deployment: technical/dashboard.md
      - CAD Designs: technical/cad.md
      - Supabase Schema: technical/supabase.md
  - Scaling:
      - District Replication: scaling/district.md
      - Continuity & Handover: scaling/continuity.md
      - Train the Trainer: scaling/train-trainer.md
  - Resources:
      - Printable Resources: resources/printables.md
      - Forms & Permissions: resources/forms.md
      - Supplier Directory: resources/suppliers.md
      - FAQ & Troubleshooting: resources/faq.md
      - Accessibility Guide: resources/accessibility.md
  - Contributing:
      - Contribution Guide: contributing/guide.md
      - Code of Conduct: contributing/conduct.md
      - Security Policy: contributing/security.md
      - License: contributing/license.md