<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Complete Kit | The Cap Collective</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='%23059669'%3E%3Ccircle cx='32' cy='8' r='5'/%3E%3Ccircle cx='44' cy='11.2' r='5'/%3E%3Ccircle cx='52.8' cy='20' r='5'/%3E%3Ccircle cx='56' cy='32' r='5'/%3E%3Ccircle cx='52.8' cy='44' r='5'/%3E%3Ccircle cx='44' cy='52.8' r='5'/%3E%3Ccircle cx='32' cy='56' r='5'/%3E%3Ccircle cx='20' cy='52.8' r='5'/%3E%3Ccircle cx='11.2' cy='44' r='5'/%3E%3Ccircle cx='8' cy='32' r='5'/%3E%3Ccircle cx='11.2' cy='20' r='5'/%3E%3Ccircle cx='20' cy='11.2' r='5'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='24' fill='%2310b981' stroke='%23047857' stroke-width='2'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@5/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: {
            fontFamily: { sans: ['Inter','sans-serif'], display: ['Plus Jakarta Sans','sans-serif'] },
            colors: { brand: { 500:'#10b981', 600:'#059669', 700:'#047857', 900:'#064e3b' } }
        } } };
    </script>
    <style>
        .glass { background: rgba(18,31,28,.7); backdrop-filter: blur(12px); border: 1px solid rgba(16,185,129,.15); }
        .doc-body h1 { font-family: 'Plus Jakarta Sans',sans-serif; font-weight: 800; font-size: 1.7rem; color:#fff; margin: 1.5rem 0 .5rem; }
        .doc-body h2 { font-family: 'Plus Jakarta Sans',sans-serif; font-weight: 700; font-size: 1.3rem; color:#6ee7b7; margin: 1.5rem 0 .5rem; border-bottom:1px solid rgba(16,185,129,.15); padding-bottom:.3rem; }
        .doc-body h3 { font-weight: 700; font-size: 1.05rem; color:#a7f3d0; margin: 1.2rem 0 .4rem; }
        .doc-body p { color:#cbd5e1; margin:.6rem 0; line-height:1.75; }
        .doc-body ul, .doc-body ol { margin:.6rem 0; padding-left:1.4rem; color:#cbd5e1; }
        .doc-body ul { list-style: disc; }
        .doc-body ol { list-style: decimal; }
        .doc-body li { margin:.25rem 0; }
        .doc-body table { width:100%; border-collapse: collapse; margin:1rem 0; font-size:.85rem; }
        .doc-body th { background:rgba(16,185,129,.12); color:#6ee7b7; padding:.5rem; text-align:left; }
        .doc-body td { padding:.5rem; border-top:1px solid rgba(16,185,129,.15); }
        .doc-body code { background:rgba(16,185,129,.1); padding:.15rem .4rem; border-radius:.3rem; font-size:.85em; }
        .doc-body pre { background:#0a1412; border:1px solid rgba(16,185,129,.2); border-radius:.6rem; padding:1rem; overflow-x:auto; margin:1rem 0; }
        .doc-body pre code { background:none; padding:0; }
        .doc-body blockquote { border-left:3px solid #10b981; padding:.4rem 1rem; margin:1rem 0; color:#94a3b8; background:rgba(16,185,129,.05); border-radius:0 .5rem .5rem 0; }
        .doc-body a { color:#34d399; text-decoration: underline; }
        mark { background:#fbbf24; color:#1c1917; padding:0 .15rem; border-radius:.2rem; }
    </style>
</head>
<body class="bg-[#070d0c] text-slate-100 font-sans antialiased">

    <header class="fixed top-0 left-0 w-full z-50 glass border-b border-emerald-900/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-400 to-teal-600 flex items-center justify-center text-white font-bold text-xl"><i class="fa-solid fa-recycle text-lg"></i></div>
                <div>
                    <span class="font-display font-bold text-lg tracking-tight bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">THE CAP COLLECTIVE</span>
                    <span class="block text-[10px] text-emerald-400/80 uppercase tracking-widest font-semibold">The Complete Kit</span>
                </div>
            </a>
            <nav class="hidden md:flex items-center space-x-5 text-sm font-medium text-slate-300">
                <a href="index.html" class="hover:text-emerald-400 transition-colors">Home</a>
                <a href="shop.html" class="hover:text-emerald-400 transition-colors">Eco-Store</a>
                <a href="tracker.html" class="hover:text-emerald-400 transition-colors">Live Tracker</a>
                <a href="learn.html" class="hover:text-emerald-400 transition-colors">Safety Quiz</a>
                <a href="gallery.html" class="hover:text-emerald-400 transition-colors">Impact</a>
                <a href="kit.html" class="text-emerald-400">The Kit</a>
            </nav>
        </div>
    </header>

    <main class="pt-24 pb-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col lg:flex-row gap-6 mt-6">
            <aside class="lg:w-80 shrink-0">
                <div class="lg:sticky lg:top-28 space-y-4">
                    <div class="glass rounded-2xl p-4">
                        <h2 class="font-display font-bold text-sm uppercase tracking-wider text-emerald-300 mb-3">School Kit Library</h2>
                        <input id="doc-filter" type="search" placeholder="Filter docs…" class="w-full px-4 py-2.5 rounded-xl bg-[#0b1311] border border-emerald-900/40 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 text-sm" />
                        <div id="doc-list" class="mt-3 max-h-[50vh] overflow-y-auto pr-1 space-y-1 text-sm"></div>
                    </div>
                    <a href="assets/Cap_Collective_Full_Kit.pdf" class="block glass rounded-2xl p-4 hover:border-emerald-500/40 transition-all">
                        <p class="font-bold text-emerald-300"><i class="fa-solid fa-file-pdf mr-2"></i>Download Full Kit (PDF)</p>
                        <p class="text-xs text-slate-400 mt-1">Overview + all modules in one portable file.</p>
                    </a>
                </div>
            </aside>
            <section class="flex-1 min-w-0">
                <div class="glass rounded-2xl overflow-hidden">
                    <div class="p-5 border-b border-emerald-900/40 flex items-center justify-between">
                        <h1 id="doc-title" class="font-display font-bold text-lg text-white">Select a document</h1>
                        <div class="flex items-center space-x-2">
                            <span id="doc-lines" class="text-xs text-slate-500"></span>
                            <a id="doc-raw" href="#" class="text-xs text-emerald-400 hover:text-emerald-300">raw</a>
                        </div>
                    </div>
                    <div class="relative">
                        <input id="doc-search" type="search" placeholder="Search within this document…" class="w-full px-5 py-3 border-b border-emerald-900/40 bg-[#0b1311] text-sm text-white placeholder-slate-600 focus:outline-none" />
                    </div>
                    <div id="results" class="hidden max-h-64 overflow-y-auto border-b border-emerald-900/40 text-sm"></div>
                    <article id="doc-body" class="doc-body p-6 sm:p-10 min-h-[60vh]"></article>
                </div>
            </section>
        </div>
    </main>

    <footer class="border-t border-emerald-950/60 py-10 text-center text-sm text-slate-500">
        <p>&copy; <span id="year"></span> Cap Collective · School Kit v1.1.0 · <a class="text-emerald-500" href="kit/README.md">Readme</a> · <a class="text-emerald-500" href="kit/CHANGELOG.md">Changelog</a></p>
    </footer>

    <script>
        let MANIFEST = [];
        async function init() {
            try {
                MANIFEST = await (await fetch("kit/manifest.json")).json();
            } catch (e) { MANIFEST = []; }
            renderList();
            const fromHash = decodeURIComponent(location.hash.replace(/^#doc=/, ""));
            if (fromHash) openDoc(fromHash);
        }
        function renderList() {
            const q = (document.getElementById("doc-filter").value || "").toLowerCase();
            const list = MANIFEST.filter(d => !q || d.file.toLowerCase().includes(q) || d.title.toLowerCase().includes(q));
            document.getElementById("doc-list").innerHTML = list.length
                ? list.map(d => `
                    <button onclick="openDoc('${d.file}')" class="docitem w-full text-left px-3 py-2 rounded-lg hover:bg-emerald-900/30 text-slate-300 transition-all">
                        <span class="text-xs text-emerald-500 font-mono">${d.file.slice(0,2)}</span> <span>${d.title}</span>
                    </button>`).join("")
                : '<p class="text-slate-500 px-3 py-2">No docs match.</p>';
        }
        async function openDoc(file) {
            document.querySelectorAll(".docitem").forEach(b => b.classList.remove("!bg-emerald-500/15"));
            [...document.querySelectorAll(".docitem")].forEach(b => { if (b.onclick.toString().includes(file)) b.classList.add("!bg-emerald-500/15"); });
            document.getElementById("doc-filter").value = "";
            renderList();
            const title = (MANIFEST.find(d => d.file === file) || {}).title || file;
            document.getElementById("doc-title").textContent = title;
            document.getElementById("doc-raw").href = "kit/" + file;
            location.hash = "#doc=" + encodeURIComponent(file);
            const txt = await (await fetch("kit/" + file)).text();
            document.getElementById("doc-lines").textContent = txt.split("\n").length + " lines · " + Math.round(txt.length / 1024) + " kB";
            document.getElementById("search-cache") || (() => { const c = document.createElement("span"); c.id = "search-cache"; document.body.appendChild(c); })();
            document.getElementById("search-cache").dataset.txt = txt;
            document.getElementById("doc-body").innerHTML = marked.parse(txt);
            document.getElementById("results").classList.add("hidden");
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
            document.getElementById("doc-body").scrollIntoView({ block: "start" });
        }
        document.getElementById("doc-filter").addEventListener("input", renderList);
        document.getElementById("doc-search").addEventListener("input", (e) => {
            const q = e.target.value.trim().toLowerCase();
            const wrap = document.getElementById("results");
            const txt = document.getElementById("search-cache")?.dataset.txt || "";
            if (!q) { wrap.classList.add("hidden"); return; }
            const hits = [];
            const lines = txt.split("\n");
            lines.forEach((line, i) => { if (line.toLowerCase().includes(q) && hits.length < 30) hits.push({ i, line }); });
            wrap.innerHTML = hits.length
                ? hits.map(h => `<button onclick="goToLine(${h.i})" class="block w-full text-left px-5 py-2 hover:bg-emerald-900/30 border-b border-emerald-900/20">
                        <span class="text-emerald-500 font-mono mr-2">${h.i + 1}</span><span class="text-slate-300">${h.line.slice(0, 120)}</span></button>`).join("")
                : '<p class="px-5 py-3 text-slate-500">No matches.</p>';
            wrap.classList.remove("hidden");
        });
        function goToLine(i) {
            const body = document.getElementById("doc-body");
            const paras = body.querySelectorAll("p,h1,h2,h3,li,pre");
            const target = paras[Math.min(i - 1, paras.length - 1)];
            if (target) {
                body.innerHTML = body.innerHTML.replace(/<mark>/g, "").replace(/<\/mark>/g, "");
                const q = document.getElementById("doc-search").value.trim();
                const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
                const pos = target.textContent.toLowerCase().includes(q.toLowerCase());
                if (pos) target.innerHTML = target.textContent.replace(re, "<mark>$1</mark>");
                target.scrollIntoView({ block: "center" });
            }
        }
        document.getElementById("year").textContent = new Date().getFullYear();
        init();
    </script>
</body>
</html>
