<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bottle Cap Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{--bg:#0b1020;--card:#151b2e;--fg:#e6edf7;--muted:#7f8ba5;
        --accent:#38bdf8;--green:#22c55e;--red:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:1.5rem}
  h1{font-size:1.3rem;margin:0 0 1.2rem;display:flex;align-items:center;gap:.5rem}
  h2{font-size:.75rem;color:var(--muted);text-transform:uppercase;
     letter-spacing:.08em;margin:0 0 .6rem}
  .pulse{width:9px;height:9px;border-radius:50%;background:var(--green);
         box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:p 2s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}
               70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}
               100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .wrap{max-width:1200px;margin:0 auto}
  .row{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
       margin-bottom:1rem}
  .row-2{grid-template-columns:2fr 1fr}
  .card{background:var(--card);border:1px solid #222b45;border-radius:14px;padding:1.1rem}
  .stat .val{font-size:2.2rem;font-weight:700;line-height:1;color:var(--accent)}
  .stat .lbl{font-size:.8rem;color:var(--muted);margin-top:.35rem}
  .stat .sub{font-size:.75rem;color:#566;margin-top:.5rem}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid #222b45}
  th{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:none}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;
       vertical-align:middle;border:1px solid #2a3555}
  canvas{max-height:260px}
  .tag{display:inline-block;padding:.15rem .5rem;border-radius:6px;font-size:.7rem;
       background:#222b45;color:#9fb0d0;margin-left:.4rem}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="pulse"></span> Bottle Cap Analytics <span class="tag" id="conn">connecting…</span></h1>

  <div class="row">
    <div class="card stat"><div class="val" id="s1">0</div>
      <div class="lbl">Node 1 total</div><div class="sub" id="s1sub">—</div></div>
    <div class="card stat"><div class="val" id="s2">0</div>
      <div class="lbl">Node 2 total</div><div class="sub" id="s2sub">—</div></div>
    <div class="card stat"><div class="val" id="st">0</div>
      <div class="lbl">All-time total</div><div class="sub" id="stsub">—</div></div>
    <div class="card stat"><div class="val" id="stoday">0</div>
      <div class="lbl">Today</div><div class="sub" id="stodaysub">—</div></div>
  </div>

  <div class="row row-2">
    <div class="card"><h2>Caps per hour (last 24h)</h2><canvas id="lineChart"></canvas></div>
    <div class="card"><h2>Color distribution</h2><canvas id="pieChart"></canvas></div>
  </div>
  <div class="row row-2">
    <div class="card"><h2>Caps per node</h2><canvas id="barChart"></canvas></div>
    <div class="card"><h2>Node health</h2>
      <table><thead><tr><th>Node</th><th>Last seen</th><th>Status</th></tr></thead>
      <tbody id="healthBody"></tbody></table>
    </div>
  </div>

  <div class="card">
    <h2>Recent events</h2>
    <table><thead><tr><th>Time</th><th>Node</th><th>Count</th><th>Color</th></tr></thead>
    <tbody id="events"><tr><td colspan="4" style="color:#7f8ba5">Loading…</td></tr></tbody></table>
  </div>
</div>

<script>
// Configure these for your own Supabase project (Project Settings -> API)
const SB_URL  = 'https://YOUR_PROJECT.supabase.co';
const SB_ANON = 'YOUR_ANON_KEY';
const sb = window.supabase.createClient(SB_URL, SB_ANON);

const HEX = {red:'#ef4444',blue:'#3b82f6',green:'#22c55e',white:'#e5e7eb',unknown:'#7f8ba5'};
const HUES = ['red','blue','green','white','unknown'];

let lineChart, pieChart, barChart;

function initCharts() {
  lineChart = new Chart(document.getElementById('lineChart'), {
    type:'line',
    data:{labels:[],datasets:[
      {label:'Node 1',data:[],borderColor:'#22c55e',backgroundColor:'rgba(34,197,94,.15)',
       tension:.3,fill:true},
      {label:'Node 2',data:[],borderColor:'#38bdf8',backgroundColor:'rgba(56,189,248,.15)',
       tension:.3,fill:true}
    ]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#9fb0d0'}}},
      scales:{x:{ticks:{color:'#7f8ba5'},grid:{color:'#222b45'}},
              y:{ticks:{color:'#7f8ba5'},grid:{color:'#222b45'},beginAtZero:true}}}
  });

  pieChart = new Chart(document.getElementById('pieChart'), {
    type:'doughnut',
    data:{labels:HUES,datasets:[{data:[0,0,0,0,0],
      backgroundColor:HUES.map(h=>HEX[h]),borderColor:'#151b2e',borderWidth:2}]},
    options:{plugins:{legend:{position:'bottom',labels:{color:'#9fb0d0'}}}}
  });

  barChart = new Chart(document.getElementById('barChart'), {
    type:'bar',
    data:{labels:['Node 1','Node 2'],
      datasets:[{label:'Caps',data:[0,0],
        backgroundColor:['#22c55e','#38bdf8'],borderRadius:8}]},
    options:{plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#7f8ba5'},grid:{display:false}},
              y:{ticks:{color:'#7f8ba5'},grid:{color:'#222b45'},beginAtZero:true}}}
  });
}

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60)   return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

async function refresh() {
  const { data, error } = await sb.from('cap_counts')
    .select('*').order('created_at',{ascending:false}).limit(2000);
  if (error) {
    console.error(error);
    document.getElementById('conn').textContent = 'error';
    return;
  }
  document.getElementById('conn').textContent = 'live';

  const totalN1 = data.filter(r=>r.node_id===1).reduce((a,r)=>a+r.cap_count,0);
  const totalN2 = data.filter(r=>r.node_id===2).reduce((a,r)=>a+r.cap_count,0);
  const lastN1  = data.find(r=>r.node_id===1)?.created_at;
  const lastN2  = data.find(r=>r.node_id===2)?.created_at;

  document.getElementById('s1').textContent = totalN1;
  document.getElementById('s2').textContent = totalN2;
  document.getElementById('st').textContent = totalN1 + totalN2;
  document.getElementById('s1sub').textContent = lastN1 ? 'Last: '+timeAgo(lastN1) : 'No data';
  document.getElementById('s2sub').textContent = lastN2 ? 'Last: '+timeAgo(lastN2) : 'No data';
  document.getElementById('stsub').textContent = data.length
    ? 'Last event: '+timeAgo(data[0].created_at) : 'No data';

  const midnight = new Date(); midnight.setHours(0,0,0,0);
  const todayRows = data.filter(r => new Date(r.created_at) >= midnight);
  const todaySum  = todayRows.reduce((a,r)=>a+r.cap_count,0);
  document.getElementById('stoday').textContent = todaySum;
  document.getElementById('stodaysub').textContent = todayRows.length + ' events today';

  const labels = [], n1h = [], n2h = [];
  const nowH = new Date(); nowH.setMinutes(0,0,0);
  for (let i = 23; i >= 0; i--) {
    const start = new Date(nowH.getTime() - i*3600*1000);
    const end   = new Date(start.getTime() + 3600*1000);
    labels.push(start.getHours().toString().padStart(2,'0') + ':00');
    let s1=0,s2=0;
    for (const r of data) {
      const t = new Date(r.created_at).getTime();
      if (t >= start.getTime() && t < end.getTime()) {
        if (r.node_id===1) s1+=r.cap_count; else s2+=r.cap_count;
      }
    }
    n1h.push(s1); n2h.push(s2);
  }
  lineChart.data.labels = labels;
  lineChart.data.datasets[0].data = n1h;
  lineChart.data.datasets[1].data = n2h;
  lineChart.update('none');

  const colorSum = {red:0,blue:0,green:0,white:0,unknown:0};
  for (const r of data) {
    const k = r.cap_color && colorSum.hasOwnProperty(r.cap_color) ? r.cap_color : 'unknown';
    colorSum[k] += r.cap_count;
  }
  pieChart.data.datasets[0].data = HUES.map(h => colorSum[h]);
  pieChart.update('none');

  barChart.data.datasets[0].data = [totalN1, totalN2];
  barChart.update('none');

  const health = document.getElementById('healthBody');
  health.innerHTML = '';
  [1,2].forEach(n => {
    const last = n===1 ? lastN1 : lastN2;
    const online = last && (Date.now() - new Date(last).getTime()) < 120000;
    health.innerHTML += `<tr>
      <td>Node ${n}</td>
      <td>${last ? timeAgo(last) : 'never'}</td>
      <td><span class="dot" style="background:${online?'#22c55e':'#ef4444'}"></span>
          ${online?'online':'offline'}</td></tr>`;
  });

  const tbody = document.getElementById('events');
  tbody.innerHTML = '';
  data.slice(0, 40).forEach(r => {
    const c = r.cap_color || 'unknown';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${new Date(r.created_at).toLocaleString()}</td>
      <td>Node ${r.node_id}</td>
      <td>${r.cap_count}</td>
      <td><span class="dot" style="background:${HEX[c]}"></span>${c}</td>`;
    tbody.appendChild(tr);
  });
}

initCharts();
refresh();
setInterval(refresh, 15000);

sb.channel('caps-rt')
  .on('postgres_changes',
      {event:'INSERT',schema:'public',table:'cap_counts'},
      () => refresh())
  .subscribe();
</script>
</body>
</html>
