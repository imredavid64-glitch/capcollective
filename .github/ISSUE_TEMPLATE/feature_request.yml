name: Feature Request
description: Suggest a new feature, curriculum addition, hardware design, or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Cap Collective grows through community ideas. Please describe your proposal below.

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What type of feature is this?
      options:
        - Curriculum / Lesson Plan
        - Teacher Guide / Documentation
        - Hardware / CAD Design
        - Firmware / IoT Enhancement
        - Dashboard / Software Feature
        - Spreadsheet / Data Tracking
        - Grant / Fundraising Template
        - Safety / Accessibility
        - Translation / Localization
        - Printable Resource
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Who benefits?
      placeholder: |
        Currently, teachers struggle with...
        This would help [grade band / role] by...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution
      placeholder: |
        Add a new lesson on...
        Create a parametric mold for...
        Add a dashboard widget showing...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've thought of
      placeholder: |
        Could also solve this by...
        Considered but rejected because...

  - type: dropdown
    id: grade_band
    attributes:
      label: Target Grade Band (if curriculum)
      options:
        - K-2 (Cap Detectives)
        - 3-5 (Cap Engineers)
        - 6-8 (Cap Innovators)
        - 9-12 (Cap Systems Designers)
        - All / Cross-grade
        - Not applicable
    validations:
      required: false

  - type: dropdown
    id: tier
    attributes:
    attributes:
      label: Budget Tier Compatibility
      options:
        - Core ($500-1,000)
        - FabLab ($2,500-5,000)
        - Center ($10,000+)
        - All tiers
        - Not applicable
    validations:
      required: false

  - type: checkboxes
    id: standards
    attributes:
      label: Standards Alignment (if curriculum)
      options:
        - label: NGSS (Next Generation Science Standards)
        - label: Common Core Math/ELA
        - label: IB (International Baccalaureate)
        - label: State Standards (specify in description)
        - label: ISTE / CSTA (CS Standards)
        - label: Not applicable

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Notes
      description: Any technical details, file locations, or resources needed
      placeholder: |
        Would involve modifying:
        - `18_LESSON_PLAN_LIBRARY.md` (add new lesson)
        - `cad/new_mold.scad` (new design)
        - `cap-collective-dashboard/src/components/dashboard/NewWidget.tsx`

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked existing issues/PRs for similar requests
          required: true
        - label: This aligns with Cap Collective's mission (student-led, circular economy, measurable impact)
          required: true
        - label: I'm willing to contribute implementation (code, docs, design, testing)
          required: false